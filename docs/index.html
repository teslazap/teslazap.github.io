<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROBE - Network Diagnostics</title>
    <meta name="description" content="Discover your public IPv4 and IPv6 addresses, geolocation, ISP, and security indicators. Fast, private, and 100% in your browser.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%23ff6b35%22/></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #0a0e27 100%);
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Navigation Buttons */
        .nav-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: transparent;
            position: relative;
        }

        .nav-btn:hover {
            background: rgba(255, 107, 53, 0.1);
            color: #ff8c5a;
        }

        .nav-btn.active {
            background: rgba(255, 107, 53, 0.15);
            color: #ff8c5a;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: linear-gradient(to right, #ff6b35, #d73502);
            border-radius: 1px;
        }

        /* Loading Spinner */
        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid rgba(255, 107, 53, 0.3);
            border-radius: 50%;
            border-top-color: #ff6b35;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Cards */
        .card {
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 107, 53, 0.2);
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(255, 107, 53, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.1);
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fed7aa;
            margin-bottom: 0.5rem;
        }

        /* Hero Section */
        .hero-section {
            max-width: 80rem;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-label {
            color: #fed7aa;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            animation: slideInUp 0.6s ease-out 0.1s backwards;
        }

        .hero-ip {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            font-family: 'IBM Plex Mono', monospace;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 50%, #d73502 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideInUp 0.6s ease-out 0.2s backwards;
            word-break: break-all;
        }

        .hero-sub {
            font-size: 1.125rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            animation: slideInUp 0.6s ease-out 0.3s backwards;
        }

        .hero-action {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            animation: slideInUp 0.6s ease-out 0.4s backwards;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            border: 1px solid rgba(255, 107, 53, 0.2);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(to right, #ff6b35, #d73502);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.5);
            color: #cbd5e1;
            border-color: rgba(71, 85, 105, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(30, 41, 59, 0.8);
            color: #ff8c5a;
        }

        /* Grid */
        .grid-responsive {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            width: 100%;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            border: 1px solid;
            background: rgba(15, 23, 42, 0.5);
        }

        .led {
            width: 0.625rem;
            height: 0.625rem;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 2s infinite;
        }

        .badge.unknown { border-color: #475569; background: rgba(100, 116, 139, 0.1); }
        .badge.unknown .led { background: #64748b; }

        .badge.false { border-color: rgba(34, 197, 94, 0.4); background: rgba(34, 197, 94, 0.1); }
        .badge.false .led { background: #22c55e; }

        .badge.true { border-color: rgba(255, 107, 53, 0.4); background: rgba(255, 107, 53, 0.2); }
        .badge.true .led { background: #ff6b35; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .shimmer {
            animation: shimmer 2s infinite;
            background: linear-gradient(90deg, rgba(255,107,53,0.1), rgba(255,107,53,0.2), rgba(255,107,53,0.1));
            background-size: 200% 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-ip {
                font-size: 2rem;
            }

            .hero-section {
                padding: 2rem 1rem;
            }

            .grid-responsive {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e27;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 53, 0.4);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 107, 53, 0.6);
        }

        a {
            color: #fed7aa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="fixed inset-0 bg-gradient-to-br from-orange-600/15 via-red-600/10 to-transparent pointer-events-none"></div>
    <div class="fixed top-0 right-0 w-96 h-96 bg-orange-600/5 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 left-0 w-96 h-96 bg-red-600/5 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Navigation -->
    <nav class="relative z-40 backdrop-blur-md bg-slate-950/40 border-b border-orange-500/20 sticky top-0">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg shadow-orange-600/50">◉</div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-400 to-red-500 bg-clip-text text-transparent">PROBE</h1>
                    <p class="text-xs text-orange-300/60">Network Diagnostics</p>
                </div>
            </div>
            <div class="flex gap-1">
                <button onclick="app.navigate('scanner')" class="nav-btn active">Scanner</button>
                <button onclick="app.navigate('whois')" class="nav-btn">WHOIS</button>
                <button onclick="app.navigate('about')" class="nav-btn">About</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 w-full">
        <div id="app-content" class="w-full"></div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-orange-300 text-sm">Scanning...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-orange-500/10 bg-slate-950/30 backdrop-blur-sm mt-12">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                    <h3 class="text-orange-400 font-semibold mb-2">PROBE</h3>
                    <p class="text-slate-400 text-sm">Fast network diagnostics, all in your browser.</p>
                </div>
                <div>
                    <h3 class="text-orange-400 font-semibold mb-2">Privacy</h3>
                    <p class="text-slate-400 text-sm">No data saved. No private servers. Everything static on GitHub Pages.</p>
                </div>
                <div>
                    <h3 class="text-orange-400 font-semibold mb-2">External APIs</h3>
                    <p class="text-slate-400 text-sm">
                        <a href="https://www.ipify.org/" target="_blank">ipify</a>,
                        <a href="https://ipwho.is/" target="_blank">ipwho.is</a>,
                        <a href="https://rdap.org/" target="_blank">RDAP</a>
                    </p>
                </div>
            </div>
            <div class="border-t border-orange-500/10 pt-6 text-center text-slate-500 text-sm">
                <p>© 2026 PROBE — Static page, no tracking, hostable on GitHub Pages</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
